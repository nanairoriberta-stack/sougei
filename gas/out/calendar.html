<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important}body{margin:0}
/* Layout: sticky toolbar with sync status, month grid beside a day panel (stacks on phones); editor and sync details open as sheets. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunken:#eaeeec; --ink:#18201d; --muted:#5f6b66; --line:#dde3e0;
  --accent:#13795b; --accent-ink:#ffffff; --accent-soft:#dff1ea;
  --sun:#c93838; --sat:#2a62c4; --danger:#c23a32; --warn:#9a6a00; --warn-soft:#fbf1d6; --ok:#13795b;
  --l-meeting:#3f63cf; --l-visit:#11897a; --l-deadline:#d0443a; --l-leave:#b8901a; --l-event:#8352c9; --l-user:#c2410c; --l-help:#3f63cf; --l-ride:#11897a; --l-hwork:#8352c9; --l-shift:#0e7490; --l-monitor:#be185d; --l-shien:#4d7c0f; --l-other:#6f7c86;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201d; --sunken:#1f2925; --ink:#e6ece9; --muted:#97a49e; --line:#2b3632;
  --accent:#43c08f; --accent-ink:#0b1a14; --accent-soft:#1d3a2f;
  --sun:#ff8282; --sat:#86afff; --danger:#ff7d73; --warn:#f0c252; --warn-soft:#3a2f12; --ok:#43c08f;
  --l-meeting:#7d9bff; --l-visit:#3fc7b2; --l-deadline:#ff7d70; --l-leave:#e2bd4a; --l-event:#b58cf2; --l-user:#fb923c; --l-help:#7d9bff; --l-ride:#3fc7b2; --l-hwork:#b58cf2; --l-shift:#22b8cf; --l-monitor:#f472b6; --l-shien:#a3d65c; --l-other:#9aa7b0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201d; --sunken:#1f2925; --ink:#e6ece9; --muted:#97a49e; --line:#2b3632;
  --accent:#43c08f; --accent-ink:#0b1a14; --accent-soft:#1d3a2f;
  --sun:#ff8282; --sat:#86afff; --danger:#ff7d73; --warn:#f0c252; --warn-soft:#3a2f12; --ok:#43c08f;
  --l-meeting:#7d9bff; --l-visit:#3fc7b2; --l-deadline:#ff7d70; --l-leave:#e2bd4a; --l-event:#b58cf2; --l-user:#fb923c; --l-help:#7d9bff; --l-ride:#3fc7b2; --l-hwork:#b58cf2; --l-shift:#22b8cf; --l-monitor:#f472b6; --l-shien:#a3d65c; --l-other:#9aa7b0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.ver{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.sync{height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:7px;font-size:12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync[data-s="busy"] i{background:var(--warn);animation:pulse 1.2s infinite}
.sync[data-s="warn"]{border-color:var(--warn);background:var(--warn-soft)} .sync[data-s="warn"] i{background:var(--warn)}
.sync[data-s="bad"]{border-color:var(--danger);color:var(--danger)} .sync[data-s="bad"] i{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync i{animation:none!important}}
.nav{display:flex;align-items:center;gap:6px}
.month-label{font-size:20px;font-weight:700;min-width:8.5em;text-align:center;font-variant-numeric:tabular-nums}
.month-label span{font-family:var(--mono);font-weight:500}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}
.icon-btn:hover,.ghost:hover{background:var(--sunken)}
.ghost{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.ghost.sm,.primary.sm,.danger.sm{height:28px;padding:0 10px;font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);height:32px;padding:0 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.primary{height:34px;padding:0 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}

.filters{max-width:1240px;margin:0 auto;padding-block:12px 0;display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

.notices{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.notices:empty{display:none}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:8px;background:var(--sunken);color:var(--ink);font-size:13px}
.note.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.note.bad{border:1px solid var(--danger)}
.note p{margin:0;flex:1 1 260px;min-width:0}

.app{max-width:1240px;margin:0 auto;padding-block:12px 32px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);letter-spacing:.06em}
.dow .su{color:var(--sun)} .dow .sa{color:var(--sat)}
.cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0;cursor:pointer}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--sunken)} .cell.out .num{opacity:.5}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell-head{display:flex;align-items:baseline;gap:6px;min-width:0}
.num{font-family:var(--mono);font-size:13px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.cell.today .num{background:var(--accent);color:var(--accent-ink)}
.cell.su .num,.cell.hol .num{color:var(--sun)} .cell.sa .num{color:var(--sat)}
.cell.today.su .num,.cell.today.sa .num,.cell.today.hol .num{color:var(--accent-ink)}
.hol-name{font-size:10px;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev-chip{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.35;padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;min-width:0;border:0;text-align:left;width:100%}
.ev-chip.span{background:var(--c);color:var(--surface)}
.ev-chip.pend{outline:1px dashed var(--warn);outline-offset:-1px}
.ev-chip b{font-family:var(--mono);font-weight:500;font-size:10px;opacity:.8}
.ev-chip span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.more{font-size:11px;color:var(--muted);padding-left:4px}
@media (max-width:560px){
  .cell{min-height:64px;padding:4px 3px}
  .hol-name{display:none}
  .ev-chip{height:5px;padding:0;font-size:0;background:var(--c)}
  .ev-chip b,.ev-chip span{display:none}
  .more{font-size:10px;padding-left:0}
  .month-label{font-size:17px;min-width:auto}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:901px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.panel-date{font-size:22px;font-weight:700;line-height:1.2}
.panel-date small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.ev-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;min-width:0}
.ev-row{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;padding:10px 12px 10px 10px;border-radius:8px;background:var(--sunken);border:0;text-align:left;width:100%}
.ev-row:hover{background:color-mix(in srgb,var(--c) 12%,var(--sunken))}
.ev-row .stripe{border-radius:2px;background:var(--c)}
.ev-row .t{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.time{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag-pend{font-size:11px;color:var(--warn);font-weight:700}
.avatars{display:flex;margin-top:6px}
.avatars img{width:20px;height:20px;border-radius:50%;border:2px solid var(--sunken);margin-right:-6px}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 16px 16px;min-width:0}
.agenda h2{font-size:15px;margin:10px 0 4px}
.agenda .sub{font-size:12px;color:var(--muted);margin:0 0 8px}
.ag-day{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ag-day:last-child{border-bottom:0}
.ag-date{font-family:var(--mono);font-size:20px;font-weight:500;line-height:1.1}
.ag-date small{display:block;font-family:var(--font);font-size:11px;color:var(--muted);margin-top:4px}
.ag-date.su,.ag-date.hol{color:var(--sun)} .ag-date.sa{color:var(--sat)}
.trash-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:8px;background:var(--sunken)}
.trash-row .grow{flex:1 1 220px;min-width:0}
.render-err{padding:16px;border:1px solid var(--danger);border-radius:8px;color:var(--danger);background:var(--surface)}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(580px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-head h2{margin:0;font-size:16px}
.sheet-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;width:100%;min-width:0}
textarea.input{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.title-input{font-size:18px;font-weight:700;height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1 1 130px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.labels{display:flex;flex-wrap:wrap;gap:6px}
.labels label{position:relative}
.labels input{position:absolute;opacity:0;inset:0}
.labels span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;cursor:pointer}
.labels input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);font-weight:700}
.labels input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.member{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px;border-radius:999px;background:var(--sunken);font-size:12px}
.member img{width:20px;height:20px;border-radius:50%}
.member button{border:0;background:none;width:20px;height:20px;border-radius:50%;color:var(--muted)}
.picker{position:relative}
.hits{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px color-mix(in srgb,#000 18%,transparent);z-index:2;max-height:240px;overflow:auto;padding:4px}
.hits button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left}
.hits button:hover,.hits button:focus-visible{background:var(--sunken)}
.hits img{width:22px;height:22px;border-radius:50%}
.err{color:var(--danger);font-size:12px;margin:0}
.sheet-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.spacer{flex:1}
.danger{height:34px;padding:0 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));background:var(--surface);color:var(--danger);font-size:13px}
.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.by{font-size:11px;color:var(--muted)}
.comments{border-top:1px solid var(--line);padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.comments h3{margin:0;font-size:13px}
.cmt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px}
.cmt img{width:24px;height:24px;border-radius:50%}
.cmt .who{font-size:12px;font-weight:700}
.cmt .who small{font-weight:400;color:var(--muted);font-family:var(--mono);margin-left:6px}
.cmt p{margin:2px 0 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt-form{display:flex;gap:8px}
.cmt-form .input{flex:1}
.op{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.op h4{margin:0;font-size:13px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp div{background:var(--sunken);border-radius:8px;padding:8px 10px;font-size:12px;min-width:0;overflow-wrap:anywhere}
.cmp b{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
@media (max-width:480px){.cmp{grid-template-columns:minmax(0,1fr)}}
.op .acts{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}

.sgbox{--sc:var(--l-user);border:1px solid color-mix(in srgb,var(--sc) 35%,var(--line));border-radius:10px;padding:12px;background:color-mix(in srgb,var(--sc) 5%,var(--surface))}
.sgbox .lbl{color:var(--sc)!important;font-weight:700}
.sgsub{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sgsub .lbl2{font-size:12px;font-weight:700;color:var(--muted,inherit)}
.sgchip small{margin-left:4px;font-size:10px;opacity:.7}
.fills{display:flex;flex-wrap:wrap;gap:6px}
.fill{height:28px;padding:0 10px;border-radius:999px;border:1px dashed var(--line);background:transparent;font-size:12px;cursor:pointer;color:inherit}
.fill.on{border-style:solid;border-color:var(--accent);font-weight:700}
.sghint{margin:8px 0 0}
.sgchips{display:flex;flex-wrap:wrap;gap:6px}
.sgchip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.sgchip button{border:0;background:none;width:22px;height:22px;border-radius:50%;color:var(--muted)}
.sghits{border:1px solid var(--line);border-radius:8px;max-height:200px;overflow:auto;background:var(--surface)}
.sghits button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:8px 10px;text-align:left;font-size:14px}
.sghits button:hover,.sghits button:focus-visible{background:var(--sunken)}
.sghits small{color:var(--muted)}
.tag-sg{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.quick{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--l-leave) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--l-leave) 35%,var(--line))}
.quick b{font-size:13px}
.quick .qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.quick .qrow select{height:48px;font-size:16px;font-weight:700}
.quick .qrow .primary{height:48px;padding:0 22px;font-size:16px}
.quick select{height:36px}
@media (max-width:560px){.bar-in .seg{order:5}.bar-in #addBtn{order:6}}
/* スマホ：上の帯は流れるように（固定すると画面の3分の1を取る）、ラベルの絞り込みは横に流す、入力欄は16px（iPhoneで拡大されない） */
@media (max-width:560px){
  .bar{position:static}
  .bar-in{gap:8px 8px;padding-block:8px}
  .brand{font-size:16px}
  .ver{display:none}
  .nav{flex:1 1 100%}
  .nav .month-label{flex:none;min-width:7.2em}
  .nav #todayBtn{margin-left:auto}
  .seg{flex:1 1 auto} .seg button{flex:1;padding:0 8px}
  #addBtn{flex:1 1 auto;height:36px}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .app{padding-block:10px 24px;gap:12px}
  .panel{padding:14px}
  .panel-date{font-size:20px}
  .input,select.input,textarea.input{font-size:16px}
  .title-input{font-size:18px}
  .overlay{padding:0;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
  .sheet{width:100%;max-height:100%;height:100%;border-radius:14px 14px 0 0}
  .sheet-body{padding:14px 16px}
  .sheet-foot{padding:10px 16px max(10px,env(safe-area-inset-bottom,0px))}
  .sheet-foot .primary,.sheet-foot .ghost,.sheet-foot .danger{height:42px;font-size:15px}
  .lblpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .lblpick label span{width:100%;justify-content:center;padding:0 4px;height:36px;font-size:12px}
}
</style>
</head><body>


<header class="bar"><div class="bar-in gutter">
  <div class="brand"><i></i>カレンダー <span class="ver" id="ver"></span></div>

<script>/*__BOOT__*/window.__SG_PAGE="calendar";</script>
<script>/* チームカレンダー 保存コア — 画面から独立した保存・同期ロジック（テストと本番で同じコードを使う） */
(function (G) {
"use strict";
const SCHEMA = 1;              // データ形式の版。これより新しい形式のデータには書き込まない
const SHARDS = 4;              // 1日の予定を4つの文書に分けて同時書込の衝突を減らす
const LEASE_MS = 20000;        // 排他ロックの有効時間
const RELEASE_MS = 1000;       // 書込後はロックを1秒に縮めて次の人に譲る
const WRITE_DEADLINE = 5000;   // ロック取得からこの時間を過ぎたら書かずにやり直す
const CALL_TIMEOUT = 10000;    // 読込・ロックのタイムアウト
const SET_TIMEOUT = 5000;      // 書込のタイムアウト
const LOCK_WAIT_MAX = 90000;   // ロック待ちの上限（超えたら後で再送）
const MAX_BYTES = 240000;      // 1文書の上限（基盤は256KiB）
const MAX_COMMENTS = 100;
const TRASH_DAYS = 30;
const LABEL_KEYS = ["help", "ride", "leave", "user", "other", "hwork", "shift", "monitor", "shien"];  // 以前の会議・外出・締切・社内イベントは「その他予定」として表示
const SG_TYPES = ["staff_off", "staff_plan", "user_absent", "user_time", "help", "hwork", "shift"];
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/, TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
const ID_RE = /^[A-Za-z0-9_-]{6,64}$/;
const PERM = ["invalid_argument", "quota_exceeded", "transform_error", "full", "outdated_client"];
const PAUSE = ["revoked", "not_granted", "capability_disabled", "capability_removed"];

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const shardOf = id => hash(id) % SHARDS;
const dayPath = (date, id) => `days/${date}_${shardOf(id)}`;
const cmPath = (key, id) => `cm/${key}_${shardOf(id)}`;
const lockOf = p => "locks/" + p.replace("/", "~");
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";
const uid = (rnd) => { const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; let s = ""; for (let i = 0; i < 20; i++) s += a[Math.floor(rnd() * a.length)]; return s; };
function utf8len(str){let n=0;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);if(c<0x80)n+=1;else if(c<0x800)n+=2;else if(c>=0xd800&&c<0xdc00){n+=4;i++}else n+=3}return n}
const bytes = o => utf8len(JSON.stringify(o));

/* ---------- 受け取ったデータは信用しない：形と長さをそろえる ---------- */
function normEvent(r, id, depth) {
  if (!r || typeof r !== "object" || !ID_RE.test(String(id))) return null;
  if (!DATE_RE.test(r.date)) return null;
  const date = r.date;
  const endDate = DATE_RE.test(r.endDate) && r.endDate >= date ? r.endDate : date;
  const start = TIME_RE.test(r.start) ? r.start : "", end = TIME_RE.test(r.end) ? r.end : "";
  const allDay = r.allDay === true || !start || !end;
  const e = {
    id: String(id), title: str(r.title, 80) || "（無題）", date, endDate, allDay,
    start: allDay ? "" : start, end: allDay ? "" : end,
    label: LABEL_KEYS.includes(r.label) ? r.label : "other",
    place: str(r.place, 80), memo: str(r.memo, 2000),
    tanto: Array.isArray(r.tanto) ? [...new Set(r.tanto.filter(x => typeof x === "string" && x && x.length <= 40))].slice(0, 20) : [],  // 担当（職員の名前。その他予定）
    members: Array.isArray(r.members) ? [...new Set(r.members.filter(x => typeof x === "string" && x.length <= 64))].slice(0, 100) : [],
    createdBy: typeof r.createdBy === "string" ? r.createdBy.slice(0, 64) : null, createdAt: str(r.createdAt, 40),
    updatedBy: typeof r.updatedBy === "string" ? r.updatedBy.slice(0, 64) : null, updatedAt: str(r.updatedAt, 40),
    rev: Number.isInteger(r.rev) && r.rev > 0 ? r.rev : 1, lastOp: str(r.lastOp, 80),
    cmKey: DATE_RE.test(r.cmKey) ? r.cmKey : date,
    deleted: r.deleted === true, deletedAt: str(r.deletedAt, 40),
    deletedBy: typeof r.deletedBy === "string" ? r.deletedBy.slice(0, 64) : null,
    prev: null,
    sg: normSg(r.sg),
  };
  if (!depth && r.prev && typeof r.prev === "object") e.prev = normEvent(r.prev, id, 1);
  return e;
}
function normDay(raw) {
  const out = {};
  const ev = raw && typeof raw.events === "object" && raw.events ? raw.events : {};
  for (const k of Object.keys(ev)) { const e = normEvent(ev[k], k, 0); if (e) out[k] = e; }
  return out;
}
function normComment(c) {
  if (!c || typeof c !== "object" || !ID_RE.test(String(c.id))) return null;
  const text = str(c.text, 500).trim(); if (!text) return null;
  return { id: String(c.id), text, by: typeof c.by === "string" ? c.by.slice(0, 64) : null, at: str(c.at, 40) };
}
function normCm(raw) {
  const out = {};
  const m = raw && typeof raw.comments === "object" && raw.comments ? raw.comments : {};
  for (const k of Object.keys(m)) {
    if (!ID_RE.test(k) || !Array.isArray(m[k])) continue;
    out[k] = m[k].map(normComment).filter(Boolean).slice(0, MAX_COMMENTS);
  }
  return out;
}
/* 送迎表への反映内容（職員・利用者は送迎表の名前で持つ） */
function normSg(x) {
  if (!x || typeof x !== "object" || !SG_TYPES.includes(x.type)) return null;
  const names = (a) => Array.isArray(a) ? [...new Set(a.filter((v) => typeof v === "string" && v && v.length <= 40))].slice(0, 80) : [];
  const t = (v) => (TIME_RE.test(v) ? v : "");
  return { type: x.type, staff: names(x.staff), users: names(x.users), meet: t(x.meet), send: t(x.send), noMeet: str(x.noMeet, 40), noSend: str(x.noSend, 40), half: x.type === "staff_off" && (x.half === "am" || x.half === "pm") ? x.half : "",
    reason: str(x.reason, 40), note: str(x.note, 40),                            // 理由（欠席・勤務時間変更）／行き先（ヘルプ）
    dept: x.type === "hwork" || x.type === "shift" ? str(x.dept, 40) : "",       // その日の部署は送迎表の名前で持つ
    wstart: x.type === "shift" ? t(x.wstart) : "", wend: x.type === "shift" ? t(x.wend) : "",  // 勤務時間変更：出勤・退勤の時刻（空ならいつもどおり）
    meetPlace: x.type === "user_time" ? str(x.meetPlace, 40) : "", sendPlace: x.type === "user_time" ? str(x.sendPlace, 40) : "" };  // 送迎：その日の迎え先・送り先  // 勤務時間変更：出勤・退勤の時刻（空ならいつもどおり）
}
const strip = e => { const x = clone(e); x.prev = null; return x; };

/* ---------- 文書の組み立て（容量ガードとゴミ箱の自動整理つき） ---------- */
function buildDay(path, events, nowIso) {
  const limit = nowIso ? new Date(Date.parse(nowIso) - TRASH_DAYS * 864e5).toISOString() : "";
  for (const k of Object.keys(events)) { const e = events[k]; if (e.deleted && e.deletedAt && limit && e.deletedAt < limit) delete events[k]; }
  const [date, sh] = path.slice(5).split("_");
  let maxEnd = date;
  for (const e of Object.values(events)) if (e.endDate > maxEnd) maxEnd = e.endDate;
  const doc = { v: SCHEMA, date, shard: Number(sh), maxEnd, events };
  if (bytes(doc) > MAX_BYTES) {
    const order = Object.values(events).filter(e => e.prev).sort((a, b) => (a.updatedAt || "").localeCompare(b.updatedAt || ""));
    for (const e of order) { e.prev = null; if (bytes(doc) <= MAX_BYTES) break; }
    if (bytes(doc) > MAX_BYTES) return null;
  }
  return doc;
}

/* ---------- 操作を、最新のサーバーデータに当てはめる（純粋関数） ---------- */
function baseOk(ex, op) { return !!ex && ((op.baseOp && ex.lastOp === op.baseOp) || (op.baseRev > 0 && ex.rev === op.baseRev)); }
function targetsOf(op) {
  if (op.kind === "comment") return [cmPath(op.cmKey, op.eventId)];
  if (op.kind === "upsert") { const a = dayPath(op.fromDate || op.ev.date, op.id), b = dayPath(op.ev.date, op.id); return a === b ? [a] : [a, b]; }
  return [dayPath(op.date, op.id)];
}
function outdated(raw) { return raw && Number(raw.v) > SCHEMA; }

function applyOp(op, paths, raws) {
  for (const r of raws) if (outdated(r)) return { status: "outdated" };
  if (op.kind === "comment") {
    const cm = normCm(raws[0]); const list = cm[op.eventId] || [];
    if (list.some(c => c.id === op.comment.id)) return { status: "done" };
    if (list.length >= MAX_COMMENTS) return { status: "full" };
    cm[op.eventId] = list.concat([normComment(op.comment)]);
    const doc = { v: SCHEMA, date: op.cmKey, comments: cm };
    if (bytes(doc) > MAX_BYTES) return { status: "full" };
    return { status: "ok", writes: [{ path: paths[0], data: doc }], verify: { path: paths[0], check: d => (d.comments?.[op.eventId] || []).some(c => c && c.id === op.comment.id) } };
  }
  const id = op.id;
  if (op.kind === "upsert") {
    const from = dayPath(op.fromDate || op.ev.date, id), to = dayPath(op.ev.date, id);
    const A = normDay(raws[paths.indexOf(from)]), B = from === to ? A : normDay(raws[paths.indexOf(to)]);
    const exB = B[id], exA = A[id];
    if (exB && exB.lastOp === op.opId) {           // 前回の送信は届いていた（応答だけ消えた）
      if (from !== to && exA && exA.lastOp !== op.opId) { delete A[id]; const da = buildDay(from, A, op.at); return da ? { status: "ok", writes: [{ path: from, data: da }], verify: null } : { status: "full" }; }
      return { status: "done" };
    }
    const ex = exA;
    if (op.baseRev == null && !op.baseOp) {          // 新規作成
      if (ex || exB) return { status: "conflict", reason: "exists", theirs: ex || exB };
    } else if (!op.force) {
      if (!ex || ex.deleted) return { status: "conflict", reason: ex ? "deleted" : "missing", theirs: ex || null };
      if (!baseOk(ex, op)) return { status: "conflict", reason: "changed", theirs: ex };
    }
    const base = ex && !ex.deleted ? ex : null;
    const ne = normEvent(Object.assign({}, op.ev, {
      rev: (ex ? ex.rev : (exB ? exB.rev : 0)) + 1, lastOp: op.opId,
      createdBy: base ? base.createdBy : (ex ? ex.createdBy : op.by), createdAt: base ? base.createdAt : (ex ? ex.createdAt : op.at),
      updatedBy: op.by, updatedAt: op.at, cmKey: ex ? ex.cmKey : (exB ? exB.cmKey : op.ev.date), deleted: false,
    }), id, 1);
    if (!ne) return { status: "failed" };
    ne.prev = ex ? strip(ex) : null;
    const writes = [];
    B[id] = ne;
    const db_ = buildDay(to, B, op.at); if (!db_) return { status: "full" };
    writes.push({ path: to, data: db_ });            // 移動のときは「新しい日に書く」→「元の日から消す」の順（途中で切れても消えずに重複側に倒れる）
    if (from !== to) { delete A[id]; const da = buildDay(from, A, op.at); if (!da) return { status: "full" }; writes.push({ path: from, data: da }); }
    return { status: "ok", writes, verify: { path: to, check: d => d.events?.[id]?.lastOp === op.opId } };
  }
  const D = normDay(raws[0]); const ex = D[id];
  if (ex && ex.lastOp === op.opId) return { status: "done" };
  if (op.kind === "delete") {
    if (!ex || ex.deleted) return { status: "done" };
    if (!op.force && !baseOk(ex, op)) return { status: "conflict", reason: "changed", theirs: ex };
    D[id] = Object.assign(clone(ex), { deleted: true, deletedAt: op.at, deletedBy: op.by, rev: ex.rev + 1, lastOp: op.opId, prev: strip(ex) });
  } else if (op.kind === "restore") {
    if (!ex) return { status: "conflict", reason: "missing", theirs: null };
    if (!ex.deleted) return { status: "done" };
    D[id] = Object.assign(clone(ex), { deleted: false, deletedAt: "", deletedBy: null, rev: ex.rev + 1, lastOp: op.opId, updatedBy: op.by, updatedAt: op.at });
  } else return { status: "failed" };
  const d = buildDay(paths[0], D, op.at); if (!d) return { status: "full" };
  return { status: "ok", writes: [{ path: paths[0], data: d }], verify: { path: paths[0], check: x => x.events?.[id]?.lastOp === op.opId } };
}

/* ---------- 画面に出す一覧：サーバーの内容に未送信分を必ず重ねる ---------- */
function mergeDays(docs) {
  const map = {};
  for (const raw of docs) { if (!raw) continue; const ev = normDay(raw); for (const k in ev) if (!map[k] || ev[k].rev > map[k].rev) map[k] = ev[k]; }
  return map;
}

/* ---------- 端末ストレージ（失敗してもメモリで動き続ける） ---------- */
function makeStore(ls) {
  const mem = new Map(); let persistent = true;
  try { const k = "tc:probe"; ls.setItem(k, "1"); ls.removeItem(k); } catch { persistent = false; }
  return {
    get persistent() { return persistent; },
    get(k) { if (mem.has(k)) return mem.get(k); if (!persistent) return null; try { return ls.getItem(k); } catch { return null; } },
    set(k, v) { mem.set(k, v); if (!persistent) return false; try { ls.setItem(k, v); return true; } catch { persistent = false; return false; } },
    del(k) { mem.delete(k); if (!persistent) return; try { ls.removeItem(k); } catch {} },
    keys(prefix) {
      const s = new Set([...mem.keys()].filter(k => k.startsWith(prefix)));
      if (persistent) { try { for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.startsWith(prefix)) s.add(k); } } catch {} }
      return [...s];
    },
  };
}

/* ---------- 同期エンジン ---------- */
function createCore(o) {
  const db = o.db, store = o.store;
  const now = o.now || (() => Date.now());
  const sleep = o.sleep || (ms => new Promise(r => setTimeout(r, ms)));
  const rnd = o.random || Math.random;
  const tab = o.tab || uid(rnd);
  let me = o.me || null;
  const listeners = new Set();
  let running = false, retryTimer = false, retryDelay = 0, paused = null, lastError = null, seqN = 0;
  const P = "tc:op:";

  const emit = () => { for (const f of listeners) { try { f(); } catch {} } };
  const T = (p, ms) => Promise.race([p, sleep(ms).then(() => { throw { code: "timeout" }; })]);
  const iso = () => new Date(now()).toISOString();

  function list() {
    const ops = [];
    for (const k of store.keys(P)) { const v = store.get(k); if (!v) continue; try { const op = JSON.parse(v); if (op && op.opId) ops.push(op); } catch {} }
    return ops.sort((a, b) => a.seq - b.seq);
  }
  const keyOf = op => P + String(op.seq).padStart(16, "0") + ":" + op.opId;
  function put(op) { return store.set(keyOf(op), JSON.stringify(op)); }
  function drop(op) { store.del(keyOf(op)); }

  function enqueue(op) {
    op.opId = op.opId || uid(rnd); op.seq = now() * 1000 + (seqN++ % 1000); op.state = "queued";
    op.by = me; op.at = iso();
    const saved = put(op);           // 送る前に「値ごと」端末に保存（障害D）
    emit(); kick();
    return { opId: op.opId, persisted: saved && store.persistent };
  }

  async function lock(path, holder) {
    const t0 = now();
    for (;;) {
      const r = await T(db.doc(path).acquire({ holder, ttlMs: LEASE_MS }), CALL_TIMEOUT);
      if (r && r.acquired) return now();
      if (now() - t0 > LOCK_WAIT_MAX) throw { code: "busy" };
      let w = r && r.expiresAt ? Date.parse(r.expiresAt) - now() : 500;
      w = Math.min(Math.max(w, 100), 3000) + Math.floor(rnd() * 300);
      await sleep(w);
    }
  }

  async function run(op) {
    if (o.runOp) return o.runOp(op);
    for (let attempt = 0; attempt < 6; attempt++) {
      const paths = targetsOf(op).slice();
      const order = paths.slice().sort();
      const holder = `${tab}:${op.opId}:${attempt}`;
      const held = []; let first = null, keep = false, restart = false;
      try {
        for (const p of order) { const t = await lock(lockOf(p), holder); held.push(lockOf(p)); if (first == null) first = t; }
        if (now() - first > WRITE_DEADLINE) { restart = true; continue; }
        const snaps = await Promise.all(paths.map(p => T(db.doc(p).get(), CALL_TIMEOUT)));
        const raws = snaps.map(s => (s && s.exists ? s.data() : null));   // 読めなかったら上の行で例外 → 何も書かない（障害A）
        const res = applyOp(op, paths, raws);
        if (res.status === "outdated") throw { code: "outdated_client" };
        if (res.status !== "ok") return res;
        for (const w of res.writes) {
          if (now() - first > WRITE_DEADLINE) { restart = true; break; }
          try { await T(db.doc(w.path).set(w.data), SET_TIMEOUT); }
          catch (e) { keep = true; throw e; }       // 届いたか不明 → ロックを解放せず期限まで持つ
        }
        if (restart) continue;
        if (res.verify) {
          const v = await T(db.doc(res.verify.path).get(), CALL_TIMEOUT);
          if (!(v && v.exists && res.verify.check(v.data()))) throw { code: "lost" };
        }
        return res;
      } finally {
        if (!keep) for (const l of held) { try { await T(db.doc(l).acquire({ holder, ttlMs: RELEASE_MS }), CALL_TIMEOUT); } catch {} }
      }
    }
    throw { code: "busy" };
  }

  async function process() {
    if (running) return; running = true;
    try {
      for (;;) {
        if (paused) break;
        const q = list().filter(x => x.state === "queued");
        if (!q.length) { retryDelay = 0; lastError = null; break; }
        const op = q[0];
        let r;
        try { r = await run(op); }
        catch (e) {
          const c = (e && e.code) || "network";
          if (PERM.includes(c)) { op.state = "failed"; op.info = { code: c }; put(op); if (c === "outdated_client") { paused = c; } emit(); continue; }
          if (PAUSE.includes(c)) { paused = c; emit(); break; }
          lastError = c; retryDelay = Math.min(retryDelay ? retryDelay * 2 : 2000, 60000); emit(); schedule(retryDelay); break;
        }
        if (r.status === "ok" || r.status === "done") { drop(op); lastError = null; retryDelay = 0; }   // 成功した操作だけ外す（障害C）
        else if (r.status === "conflict") { op.state = "conflict"; op.info = { reason: r.reason, theirs: r.theirs || null }; put(op); }
        else { op.state = "failed"; op.info = { code: r.status }; put(op); }
        emit();
      }
    } finally { running = false; }
  }
  function schedule(ms) { if (retryTimer) return; retryTimer = true; sleep(ms).then(() => { retryTimer = false; kick(); }); }
  function kick() { process(); }

  /* 画面の操作 → 操作データ */
  function pendingFor(id) { const q = list().filter(x => x.state === "queued" && (x.id === id)); return q.length ? q[q.length - 1] : null; }
  function baseFields(ev) {
    const p = pendingFor(ev.id);
    return p ? { baseOp: p.opId, baseRev: -1 } : { baseOp: null, baseRev: ev.rev };
  }
  const api = {
    SCHEMA, normEvent, normDay, normCm, mergeDays, applyOp, targetsOf, dayPath, cmPath, shardOf, buildDay,
    get tab() { return tab; },
    setMe(id) { me = id; },
    on(f) { listeners.add(f); return () => listeners.delete(f); },
    list, kick,
    status() {
      const ops = list();
      return { queued: ops.filter(x => x.state === "queued").length, conflicts: ops.filter(x => x.state === "conflict"), failed: ops.filter(x => x.state === "failed"), running, paused, lastError, persistent: store.persistent, retryDelay };
    },
    newId() { return uid(rnd); },
    save(ev, editing) {   // ev: 画面の入力値（date, title...）
      const id = editing ? editing.id : (ev.id || uid(rnd));
      const op = { kind: "upsert", id, ev: Object.assign({}, ev, { id }), fromDate: editing ? editing.date : ev.date, baseRev: null, baseOp: null };
      if (editing) Object.assign(op, baseFields(editing));
      return enqueue(op);

function cmp(a,b){const sa=a.date!==a.endDate,sb=b.date!==b.endDate;if(sa!==sb)return sa?-1:1;if(a.allDay!==b.allDay)return a.allDay?-1:1;return(a.start||"").localeCompare(b.start||"")||a.title.localeCompare(b.title)}

function renderSync(){
  const b=$("syncBtn"),t=$("syncText");let s="ok",txt="保存済み ✓";
  if(S.dbState==="none"){s="bad";txt="共有に接続できません"}
  else if(!core){s="busy";txt="接続中…"}
  else{const st=core.status();
    if(st.paused){s="bad";txt=st.paused==="outdated_client"?"新しい版があります":"送信を停止中"}
    else if(st.conflicts.length||st.failed.length){s="bad";txt=`要確認 ${st.conflicts.length+st.failed.length}件`}
    else if(st.queued){s=S.online&&!st.lastError?"busy":"warn";txt=S.online&&!st.lastError?`送信中 ${st.queued}件`:`未送信 ${st.queued}件：自動で再送します`}
    else if(!S.loaded){s="busy";txt="読み込み中…"}

/* ---------- 受信（読込）：読めなかったときは何も書かない ---------- */
function subscribe(){
  if(!db)return;unsub?.();S.loaded=false;
  const{start,end}=gridRange();
  try{
    unsub=db.collection("days").where("maxEnd",">=",ymd(start)).where("date","<=",ymd(end)).limit(1000)
      .onSnapshot(snap=>{const docs=snap.docs.map(d=>d.data());S.server=C.mergeDays(docs);S.loaded=true;if(S.dbState==="error")S.dbState="ok";render()},
        ()=>{S.dbState="error";render()});
  }catch{S.dbState="error";render()}
}
function go(delta){S.cursor=new Date(S.cursor.getFullYear(),S.cursor.getMonth()+delta,1);subscribe();render()}

/* ---------- ラベルごとの入力項目と、送迎表への反映 ----------
   ラベルを選ぶと、そのラベルで入力する項目が出る。入力内容から「送迎表に反映」(sg) を組み立てる。
   ・ヘルプ … 担当職員・開始時刻・行き先 → 送迎表の【ヘルプ】（担当未定は保留欄）
   ・送迎 … 利用者・迎え（いつもどおり/時間変更/家族送り/受診後送り）・送り（いつもどおり/時間変更/家族迎え）・迎え先・送り先の変更
   ・職員休み … 職員・1日/AM休/PM休/時間 → 休み・半休・不在
   ・利用者休み … 利用者・理由（任意） → 欠席
   ・その他予定 … 時間・場所・担当（職員の予定として送迎表に載せることもできる）
   ・休日出勤 … 職員・時間・その日の部署 → 送迎表の出勤者に入る
   ・勤務時間変更 … 職員・出勤／退勤（いつもどおり or 時刻を変える）・その日の部署・理由 → その日の勤務時間
   ・モニタリング／支援会議 … 利用者・時間・場所・対応者 → 対応者の予定（その時間は送迎と重なると注意が出る） */
const HALF={am:"AM休",pm:"PM休"};
const SGT_SHORT={staff_off:"職員の休み",staff_plan:"職員の予定",user_absent:"欠席",user_time:"送迎の変更",help:"ヘルプ",hwork:"休日出勤",shift:"勤務時間変更"};
const PICK={user:["体調不良","受診","家族の用事","ショートステイ"],shift:["早出","遅出","残業","遅刻・早退"]};
const NO_MEET={fam:"家族送り",clinic:"受診後送り"},NO_SEND={fam:"家族迎え"};   // 送迎表の「迎えなし・送りなし」の理由としてそのまま出る
const LABEL_OF_SG={staff_off:"leave",user_absent:"user",user_time:"ride",help:"help",hwork:"hwork",shift:"shift",staff_plan:"other"};
const USER_LABELS=["help","ride","user"];          // 利用者が関わるラベル（送迎表の担当者だけが入力できる）
const PLAN_LABELS=["monitor","shien"];             // モニタリング・支援会議：利用者・時間・場所・対応者。対応者の予定として送迎表に入る
let SGN={staff:[],users:[],depts:[],places:[],loaded:false};
async function loadNames(){
  const H=window.SGHost;if(!H)return;
  let r=null;try{r=await H.call("names.list")}catch{}
  if(!H.directory().length)await H.loadDirectory();
  SGN={staff:H.directory().filter(d=>d.no!=="000").map(d=>({name:d.name,dept:d.no})),users:r?r.users||[]:SGN.users,depts:r?r.depts||[]:SGN.depts,places:r?r.places||[]:SGN.places,loaded:true};
}
const meInfo=()=>window.SGHost&&window.SGHost.me||{};
const canLabel=k=>{const me=meInfo();return!USER_LABELS.includes(k)||!!(me.canSougei||me.admin)};
const selfOnly=()=>!meInfo().admin;
function sgText(sg){if(!sg)return"";const who=[...(sg.staff||[]),...(sg.users||[])];const t=sg.half?HALF[sg.half]:SGT_SHORT[sg.type]||"";return`送迎表：${t}（${who.slice(0,4).join("・")}${who.length>4?` 他${who.length-4}名`:""}）`}
/* 予定 → 入力欄の状態(w)。ラベルを切り替えても、選んだ人はそのまま残す */
function workOf(d){
  const sg=d.sg||{};
  const mOf=v=>Object.keys(NO_MEET).find(k=>NO_MEET[k]===v)||(/受診/.test(v)?"clinic":"fam");
  return{staff:[...(sg.staff||d.tanto||[])],users:[...(sg.users||[])],reason:sg.reason||"",dest:sg.type==="help"?(sg.note||(sg.users||[])[0]||""):"",dept:sg.dept||"",
    leave:sg.half||(sg.type==="staff_off"&&!d.allDay?"time":"day"),
    meetM:sg.meet?"time":sg.noMeet?mOf(sg.noMeet):"same",sendM:sg.send?"time":sg.noSend?"fam":"same",meet:sg.meet||"",send:sg.send||"",mplace:sg.meetPlace||"",splace:sg.sendPlace||"",
    plan:sg.type==="staff_plan",wsM:sg.wstart?"time":"same",weM:sg.wend?"time":"same",wstart:sg.wstart||"",wend:sg.wend||""};
}
/* 入力欄の状態 → 送迎表に反映する内容 */
function sgOf(label,w){
  const base={staff:[...w.staff],users:[...w.users],meet:"",send:"",noMeet:"",noSend:"",half:"",reason:"",note:"",dept:"",wstart:"",wend:"",meetPlace:"",sendPlace:""};
  if(label==="leave")return Object.assign(base,{type:"staff_off",users:[],half:w.leave==="am"||w.leave==="pm"?w.leave:""});
  if(label==="user")return Object.assign(base,{type:"user_absent",staff:[],reason:w.reason});
  if(label==="ride")return Object.assign(base,{type:"user_time",staff:[],meet:w.meetM==="time"?w.meet:"",send:w.sendM==="time"?w.send:"",noMeet:NO_MEET[w.meetM]||"",noSend:NO_SEND[w.sendM]||"",
    meetPlace:NO_MEET[w.meetM]?"":w.mplace.trim(),sendPlace:NO_SEND[w.sendM]?"":w.splace.trim()});   // 迎えなし・送りなしのときは行き先なし
  if(label==="help"){const dest=w.dest.trim();return Object.assign(base,{type:"help",users:SGN.users.some(u=>u.name===dest)?[dest]:[],note:dest})}
  if(label==="hwork")return Object.assign(base,{type:"hwork",users:[],dept:w.dept});
  if(label==="shift")return Object.assign(base,{type:"shift",users:[],dept:w.dept,reason:w.reason,wstart:w.wsM==="time"?w.wstart:"",wend:w.weM==="time"?w.wend:""});
  if(PLAN_LABELS.includes(label))return Object.assign(base,{type:"staff_plan"});
  if(label==="other"&&w.plan)return Object.assign(base,{type:"staff_plan",users:[]});
  return null;
}
const addMin=(t,n)=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");if(!m)return"";const x=Math.min(23*60+59,Number(m[1])*60+Number(m[2])+n);return`${pad(Math.floor(x/60))}:${pad(x%60)}`};
/* ラベルによって、終日かどうかは入力欄から決まる */
function fixTimes(d){
  const w=d.w;
  if(d.label==="leave")d.allDay=w.leave!=="time";
  else if(d.label==="user"||d.label==="ride"||d.label==="shift")d.allDay=true;
  else if(d.label==="help"){d.allDay=false;d.endDate=d.date;if(d.start)d.end=addMin(d.start,60)}   // ヘルプは開始時刻だけ（長さは送迎表の決まり）
  else if(d.label==="hwork"||PLAN_LABELS.includes(d.label))d.allDay=false;
  if(d.label==="leave"&&w.leave!=="time"&&w.leave!=="day")d.endDate=d.date;
}
const staffSelf=d=>selfOnly()&&(d.label==="leave"||d.label==="hwork"||d.label==="shift");
function drawSg(){
  if(!ed)return;const box=$("sgArea");if(!box)return;
  const d=ed.d,w=d.w,ro=ed.ro,me=meInfo(),L=d.label,dis=ro?"disabled":"";
  if(staffSelf(d)&&!ro)w.staff=me.name?[me.name]:[];

function sgHits(kind,q){
  const h=$("sghits-"+kind);if(!h||!ed)return;const sel=new Set(ed.d.w[kind]||[]);
  const src=kind==="staff"?SGN.staff:SGN.users;const qq=String(q||"").trim();
  const list=src.filter(x=>!sel.has(x.name)&&(!qq||x.name.includes(qq)||x.dept.includes(qq))).slice(0,40);
  h.innerHTML=list.length?list.map(x=>`<button type="button" data-sgpick="${kind}" data-name="${esc(x.name)}"><span>${esc(x.name)}</span><small>${esc(x.dept)}</small></button>`).join(""):`<div class="by" style="padding:6px 10px">${SGN.loaded?"見つかりません":"読み込み中…"}</div>`;h.hidden=false;
}
function readSg(){
  if(!ed||!$("sgArea"))return;const w=ed.d.w;
  const rv=n=>{const x=document.querySelector(`input[name="${n}"]:checked`);return x?x.value:null};
  const iv=id=>{const x=$(id);return x?x.value.trim():null};
  for(const[n,k]of[["w-leave","leave"],["w-meet","meetM"],["w-send","sendM"],["w-ws","wsM"],["w-we","weM"]]){const v=rv(n);if(v!=null)w[k]=v}
  for(const[id,k]of[["w-dest","dest"],["w-mplace","mplace"],["w-splace","splace"],["w-reason","reason"],["w-meett","meet"],["w-sendt","send"],["w-dept","dept"],["w-wst","wstart"],["w-wet","wend"]]){const v=iv(id);if(v!=null)w[k]=v}
  if($("w-plan"))w.plan=$("w-plan").checked;
}
/* 自動で付けるタイトル（空欄のとき） */
function autoTitle(label,sg,w){
  const nm=a=>a.slice(0,3).join("・")+(a.length>3?"他":"");
  if(!sg)return"";
  if(PLAN_LABELS.includes(label))return`${LMAP[label].n}（${nm(sg.users)||"利用者"}）`;
  const r=sg.reason?`（${sg.reason}）`:"";
  if(sg.type==="staff_off")return`${nm(sg.staff)} ${sg.half?HALF[sg.half]:"休み"}`;
  if(sg.type==="user_absent")return`${nm(sg.users)} 欠席${r}`;
  if(sg.type==="user_time")return`${nm(sg.users)} ${[sg.meet&&`迎え${sg.meet}`,sg.noMeet,sg.meetPlace&&`迎え先${sg.meetPlace}`,sg.send&&`送り${sg.send}`,sg.noSend,sg.sendPlace&&`送り先${sg.sendPlace}`].filter(Boolean).join("・")}`;
  if(sg.type==="help")return`${sg.staff.length?nm(sg.staff)+" ":""}ヘルプ（${sg.note||"行き先"}）`;
  if(sg.type==="hwork")return`${nm(sg.staff)} 休日出勤`;
  if(sg.type==="shift")return`${nm(sg.staff)} ${[sg.wstart&&`出勤${sg.wstart}`,sg.wend&&`退勤${sg.wend}`].filter(Boolean).join("・")||"部署変更"}${r}`;
  return"";
}
/* 入力の確認。問題があれば日本語のメッセージを返す */
function checkSg(d,sg){
  if(!canLabel(d.label))return"このラベルは送迎表の担当者だけが入力できます。";
  if(!sg)return"";
  const w=d.w;
  if((sg.type==="staff_off"||sg.type==="hwork"||sg.type==="shift")&&!sg.staff.length)return"職員を選んでください。";
  if(sg.type==="staff_plan"&&PLAN_LABELS.includes(d.label)){
    if(!sg.users.length)return"利用者を選んでください。";
    if(!sg.staff.length)return"対応者を選んでください。";
    if(!meInfo().canSougei&&!(sg.staff.length===1&&sg.staff[0]===meInfo().name))return"対応者に自分以外を入れられるのは、送迎表の担当者と管理者だけです。対応者を自分だけにしてください。";}
  if(sg.type==="staff_plan"){
    if(!sg.staff.length)return"送迎表に載せるときは、担当の職員を選んでください。";
    if(selfOnly()&&!(sg.staff.length===1&&sg.staff[0]===meInfo().name))return"送迎表に載せられるのは自分の予定だけです。担当を自分だけにするか、チェックを外してください。";}
  if(sg.type.startsWith("user")&&!sg.users.length)return"利用者を選んでください。";
  if(sg.type==="help"){
    if(!sg.note)return"行き先を入れてください。";
    if(!sg.staff.length&&!sg.users.length)return"担当する職員を選んでください（行き先が利用者のときは未定でも入れられます）。";}
  if(sg.type==="shift"){
    if(w.wsM==="same"&&w.weM==="same"&&!w.dept)return"出勤・退勤のどちらを変えるか（または部署）を選んでください。";
    if((w.wsM==="time"&&!w.wstart)||(w.weM==="time"&&!w.wend))return"変更後の時刻を入れてください。";}
  if(sg.type==="user_time"){
    if(w.meetM==="same"&&w.sendM==="same"&&!sg.meetPlace&&!sg.sendPlace)return"迎え・送り（時間・迎え先・送り先）のどれを変えるか選んでください。";
    if((w.meetM==="time"&&!w.meet)||(w.sendM==="time"&&!w.send))return"変更後の時刻を入れてください。";}
  return"";
}
/* 休み・AM休・PM休ボタン：押すだけで自分（管理者は選んだ職員）の休みが入り、送迎表に反映される */
function quickHtml(){
  const me=window.SGHost&&window.SGHost.me;if(!me||!core)return"";
  const isStaff=SGN.staff.some(s=>s.name===me.name);
  if(!isStaff&&!me.admin)return"";
  const opts=me.admin?`<select class="input" id="qStaff">${(isStaff?[{name:me.name}]:[]).concat(SGN.staff.filter(s=>s.name!==me.name)).map(s=>`<option ${s.name===S.qStaff?"selected":""}>${esc(s.name)}</option>`).join("")}</select>`:"";
  return`<div class="quick"><b>${me.admin?"休みを入れる":"自分の休みを入れる"}（この日）</b>${opts}<div class="qrow"><select class="input" id="qKind" aria-label="休みの種類">${[["","休み（1日）"],["am","AM休"],["pm","PM休"]].map(([k,l])=>`<option value="${k}" ${String(S.qKind||"")===k?"selected":""}>${l}</option>`).join("")}</select><button class="primary" data-quick>入れる</button></div><span class="by">送迎表にも自動で反映されます。</span></div>`;
}
function quickOff(half){
  const me=window.SGHost.me;const name=me.admin&&$("qStaff")?$("qStaff").value:me.name;S.qStaff=name;
  const exist=allEvents().find(e=>!e.deleted&&e.sg&&e.sg.type==="staff_off"&&e.sg.staff.includes(name)&&e.date<=S.sel&&e.endDate>=S.sel);
  if(exist){toast("この日はすでに「"+exist.title+"」が入っています。変更はその予定を開いてください");openEditor(exist);return}
  const label=half?HALF[half]:"休み";
  core.save({title:`${name} ${label}`,date:S.sel,endDate:S.sel,allDay:true,start:"",end:"",label:"leave",place:"",memo:"",members:[],sg:{type:"staff_off",staff:[name],users:[],meet:"",send:"",noMeet:"",noSend:"",half:half||""}},null);
  toast(`${name}さんの${label}を入れました（送迎表に反映されます）`);render();
}

let ed=null;
function openEditor(ev,day,draft){
  const ro=!(db&&S.canWrite&&core);

  const d=draft?draft.form:ev?{...ev,members:[...ev.members]}:{title:"",date:day||S.sel,endDate:day||S.sel,allDay:false,start:"10:00",end:"11:00",label:"other",place:"",memo:"",members:S.me?[S.me]:[],sg:null};
  if(d.sg&&LABEL_OF_SG[d.sg.type]&&!(d.sg.type==="staff_plan"&&PLAN_LABELS.includes(d.label)))d.label=LABEL_OF_SG[d.sg.type];
  if(!d.w)d.w=workOf(d);
  ed={id:draft?draft.id:ev?.id||null,base:draft?draft.base:base,d,ro:ro||(!!ev&&!canLabel(d.label)),confirmDel:false,comments:[],err:"",changed:false};
  if(!SGN.loaded)loadNames().then(()=>{if(ed)drawSg()});
  drawSheet();
  unsubCm?.();unsubCm=null;
  if(ed.id&&db&&ed.base){try{unsubCm=db.doc(C.cmPath(ed.base.cmKey||ed.base.date,ed.id)).onSnapshot(s=>{if(!ed)return;const cm=s.exists?C.normCm(s.data()):{};ed.comments=cm[ed.id]||[];drawComments()},()=>{})}catch{}}
  setTimeout(()=>$("f-title")?.focus(),30);
}

/* ---------- 同期状況の画面（競合・失敗の解決） ---------- */
function openSync(){
  const st=core?core.status():null;
  const sum=e=>e?`<b>${esc(e.title)}</b>${e.deleted?"（削除済み）":""}<br>${esc(e.date)} ${esc(timeText(e))}${e.place?"<br>"+esc(e.place):""}`:"<b>見つかりません</b>（削除または日付変更）";
  const kindName={upsert:"予定の保存",delete:"予定の削除",restore:"予定の復元",comment:"コメント"};
  const reason={changed:"あなたが開いた後に、他の人がこの予定を変更しました。",deleted:"他の人がこの予定を削除しました。",missing:"予定が見つかりません（他の人が削除または日付を変更しました）。",exists:"同じ予定がすでにあります。"};
  const code={invalid_argument:"権限がないため保存できませんでした。",quota_exceeded:"保存できる量の上限に達しました。管理者に連絡してください。",full:"この日またはこの予定の保存量が上限です（コメントは1件の予定につき100件まで）。",outdated_client:"新しい版のデータのため、この版からは書き込めません。最新版を読み込んでから再送してください。",failed:"データの形が正しくないため保存できませんでした。"};
  const opHtml=op=>{const mine=op.kind==="upsert"?op.ev:op.kind==="comment"?null:null;const theirs=op.info&&op.info.theirs?C.normEvent(op.info.theirs,op.info.theirs.id||"xxxxxxxx",0):null;
    const body=op.kind==="comment"?`<div class="cmp"><div><b>あなたのコメント</b>${esc(op.comment.text)}</div></div>`:op.kind==="upsert"?`<div class="cmp"><div><b>あなたの入力</b>${sum(C.normEvent(op.ev,op.id,0))}</div><div><b>現在の内容</b>${sum(theirs)}</div></div>`:`<div class="cmp"><div><b>操作</b>${kindName[op.kind]}</div><div><b>現在の内容</b>${sum(theirs)}</div></div>`;
    const conflict=op.state==="conflict";
    return`<div class="op"><h4>${kindName[op.kind]||"操作"}（${fmtAt(op.at)}）</h4><p class="by" style="font-size:12px;margin:0">${conflict?reason[op.info?.reason]||"他の人の変更と重なりました。":code[op.info?.code]||"送信できませんでした。"}</p>${body}
    <div class="acts">${conflict?`<button class="primary sm" data-force="${esc(op.opId)}">自分の内容で上書き</button><button class="ghost sm" data-discard-ask="${esc(op.opId)}">現在の内容を残す（自分の操作を取り消す）</button>`:`<button class="primary sm" data-retry="${esc(op.opId)}">もう一度送る</button><button class="ghost sm" data-copy="${esc(op.opId)}">内容をコピー</button><button class="ghost sm" data-discard-ask="${esc(op.opId)}">破棄</button>`}</div><div data-confirm-slot="${esc(op.opId)}"></div></div>`};
  const issues=st?st.conflicts.concat(st.failed):[];
  $("sheetRoot").innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sy-t">
  <div class="sheet-head"><h2 id="sy-t">保存と同期の状況</h2><button class="icon-btn" data-close aria-label="閉じる">×</button></div>
  <div class="sheet-body">
    <dl class="kv"><dt>共有データ</dt><dd>${S.dbState==="ok"?(S.loaded?"接続中・最新":"読み込み中"):S.dbState==="error"?"読み込み停止中":S.dbState==="none"?"接続できません":"接続中…"}</dd>
    <dt>通信</dt><dd>${S.online?"オンライン":"オフライン"}</dd>
    <dt>未送信</dt><dd>${st?st.queued:0}件${st&&st.queued?(st.lastError?`（${Math.round(st.retryDelay/1000)}秒ごとに自動で再送）`:"（送信中）"):""}</dd>
    <dt>端末への一時保存</dt><dd>${store.persistent?"有効（画面を閉じても未送信は消えません）":"使えません（画面を閉じると未送信が消えます）"}</dd>
    <dt>アプリの版</dt><dd><span class="time">${APP_VERSION}</span>（データ形式 ${C.SCHEMA}）</dd></dl>
    <div class="row"><button class="ghost sm" data-resend ${st&&st.queued?"":"disabled"}>今すぐ再送</button><button class="ghost sm" data-reload>最新版を読み込み直す</button></div>
    ${issues.length?`<h3 style="margin:6px 0 0;font-size:14px">確認が必要な操作 ${issues.length}件</h3>${issues.map(opHtml).join("")}`:`<p class="by" style="font-size:13px;margin:0">確認が必要な操作はありません。</p>`}
    ${S.isAdmin?`<div class="op"><h4>バックアップ（編集者のみ）</h4><p class="by" style="font-size:12px;margin:0">全期間の予定とコメントを端末に保存します。月末に1回保存しておくと、万一のときに戻せます。復元は「サーバーにない予定」と「削除された予定」だけを戻し、今ある予定は上書きしません。</p><div class="acts"><button class="primary sm" data-export="json">バックアップを保存（JSON）</button><button class="ghost sm" data-export="csv">一覧をCSVで保存</button><button class="ghost sm" data-restore-file>バックアップから復元</button></div><div id="bkSlot"></div></div>`:""}
  </div></div></div>`;
}

/* ---------- バックアップ・復元（編集者のみ） ---------- */
async function fetchAll(){
  const days=[],cms=[];const y0=2026,y1=new Date().getFullYear()+3;
  for(let y=y0;y<=y1;y++)for(const[a,b]of[["01-01","06-30"],["07-01","12-31"]]){
    const s1=await db.collection("days").where("date",">=",`${y}-${a}`).where("date","<=",`${y}-${b}`).limit(1000).get();days.push(...s1.docs.map(d=>d.data()));
    const s2=await db.collection("cm").where("date",">=",`${y}-${a}`).where("date","<=",`${y}-${b}`).limit(1000).get();cms.push(...s2.docs.map(d=>d.data()));
  }
  return{days,cms};
}
async function doExport(kind){
  const slot=$("bkSlot");slot.innerHTML=`<p class="by">データを集めています…</p>`;
  try{
    const{days,cms}=await fetchAll();const events=Object.values(C.mergeDays(days));
    const stamp=ymd(new Date());let data,filename;
    if(kind==="json"){const comments={};for(const c of cms){const m=C.normCm(c);for(const k in m)comments[k]=(comments[k]||[]).concat(m[k])}
      data=JSON.stringify({app:"team-calendar",schema:C.SCHEMA,version:APP_VERSION,exportedAt:new Date().toISOString(),events,comments},null,1);filename=`チームカレンダー_バックアップ_${stamp}.json`}
    else{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;const ps=await profiles(events.flatMap(e=>e.members));
      const rows=[["開始日","終了日","終日","開始","終了","タイトル","ラベル","場所","担当","参加者","メモ","状態","更新日時"]].concat(events.sort((a,b)=>a.date.localeCompare(b.date)||cmp(a,b)).map(e=>[e.date,e.endDate,e.allDay?"終日":"",e.start,e.end,e.title,LMAP[e.label].n,e.place,(e.tanto||[]).join("、"),e.members.map(id=>ps[id]?.name||"メンバー").join("、"),e.memo,e.deleted?"削除済み":"",fmtAt(e.updatedAt)]));
      data="﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");filename=`チームカレンダー_一覧_${stamp}.csv`}
    if(!downloads){slot.innerHTML=`<p class="err">この画面では保存機能が使えません。</p>`;return}
    await downloads.save({filename,data});slot.innerHTML=`<p class="by">保存しました（予定 ${events.length}件）。</p>`;
  }catch(e){slot.innerHTML=`<p class="err">${e&&e.code==="declined"?"保存を取りやめました。":"保存できませんでした。通信状況を確認してもう一度お試しください。"}</p>`}
}
let restorePlan=null;
async function planRestore(file){
  const slot=$("bkSlot");if(!slot)return;slot.innerHTML=`<p class="by">バックアップを確認しています…</p>`;
  try{
    const j=JSON.parse(await file.text());if(!j||j.app!=="team-calendar"||!Array.isArray(j.events))throw new Error("format");
    if(Number(j.schema)>C.SCHEMA){slot.innerHTML=`<p class="err">新しい版で作られたバックアップです。最新版を読み込んでから復元してください。</p>`;return}
    const{days}=await fetchAll();const cur=C.mergeDays(days);
    const add=[],undel=[];
    for(const raw of j.events){const e=C.normEvent(raw,raw&&raw.id,0);if(!e||e.deleted)continue;const c=cur[e.id];if(!c)add.push(e);else if(c.deleted)undel.push(c)}
    restorePlan={add,undel};
    slot.innerHTML=`<p style="font-size:13px;margin:8px 0">戻す予定：サーバーにない予定 ${add.length}件、ゴミ箱から戻す予定 ${undel.length}件。今ある予定は変更しません。</p><div class="acts"><button class="primary sm" data-restore-go ${add.length+undel.length?"":"disabled"}>復元する</button><button class="ghost sm" data-restore-cancel>やめる</button></div>`;
  }catch{slot.innerHTML=`<p class="err">このファイルはバックアップとして読み込めませんでした。チームカレンダーで保存したJSONファイルを選んでください。</p>`}
}

  if(e.target.id==="cmtForm"){const i=$("f-cmt");const v=i.value.trim();if(v&&ed&&ed.base&&core){core.comment(ed.base,v);i.value="";drawComments()}}
  else if(e.target.id==="evForm"&&ed&&!ed.ro)save()});
window.addEventListener("online",()=>{S.online=true;core?.resume();render()});
window.addEventListener("offline",()=>{S.online=false;render()});
function wake(){const t=ymd(new Date());if(t!==TODAY){const wasToday=S.sel===TODAY;TODAY=t;if(wasToday){S.sel=t;const c=new Date(new Date().getFullYear(),new Date().getMonth(),1);if(+c!==+S.cursor){S.cursor=c;subscribe()}}}core?.kick();render()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
window.addEventListener("focus",wake);
window.addEventListener("beforeunload",e=>{if(core&&core.status().queued&&!store.persistent){e.preventDefault();e.returnValue=""}});

/* ---------- 起動 ---------- */
$("ver").textContent="v"+APP_VERSION;
render();
(async()=>{
  await window.SGHost.ready;
  if(/^\d{4}-\d{2}-\d{2}$/.test(window.__SG_DATE||"")){S.sel=window.__SG_DATE;const d=parse(S.sel);S.cursor=new Date(d.getFullYear(),d.getMonth(),1)}
  try{user=await window.claude.use("user")}catch{user=null}
  try{db=await window.claude.use("db")}catch{db=null}
  try{downloads=await window.claude.use("downloads")}catch{downloads=null}
  if(user){try{S.me=await user.id()}catch{}try{if(await user.can("data.write")===false)S.canWrite=false}catch{}try{S.isAdmin=await user.canEdit()}catch{}}
  if(!db){S.dbState="none";render();return}
  core=C.createCore({db,store,me:S.me,runOp:window.SGHost.runOp});
  loadNames().then(()=>render());
  window.SGHost.startPolling(60000);
  window.SGHost.onLogin(()=>core.kick());
  core.on(()=>{render();if(ed)drawComments();else if($("ov")&&$("sy-t"))openSync()});
  S.dbState="ok";subscribe();core.kick();render();   // 起動時に未送信を自動で再送（障害D）
  setInterval(()=>{if(core.status().queued&&S.online)core.kick()},30000);
})();
</script>
