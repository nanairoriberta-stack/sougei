<style>:root{--ink:#18201d;--sub:#5f6b66;--line:#c9d2ce;--bg:#f4f6f5;--card:#fff;--acc:#1d4ed8;--early:#c2410c;--late:#1e40af;--hole:#fef3c7;--holeb:#d97706;--bad:#be123c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px}
button.primary{background:#13795b;border-color:#13795b;color:#fff;font-weight:700}
.sh{max-width:1400px;margin:0 auto;padding:10px 12px 60px}
.sh-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#1e3a8a;color:#fff;padding:8px 12px;border-radius:10px}
.sh-title{font-weight:700;font-size:15px;flex:1 1 260px}
.sh-tabs{display:flex;gap:4px}.sh-tabs button{background:transparent;color:#fff;border-color:#93c5fd}.sh-tabs button[aria-pressed=true]{background:#fff;color:#1e3a8a;font-weight:700}
.sh-cal{background:transparent;color:#fff;border-color:#93c5fd}
.sh-month{display:flex;align-items:center;gap:6px}.sh-month b{font-size:16px;min-width:7em;text-align:center}.sh-month button{background:transparent;color:#fff;border-color:#93c5fd;padding:4px 10px}
.st{font-size:12px;padding:3px 8px;border-radius:999px;background:#fff;color:var(--ink)}.st.busy{color:#92400e}.st.bad{color:var(--bad)}
.sh-tools,.sh-wishbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button[aria-pressed=true]{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.note{color:var(--sub);font-size:12px}.sh-wishbar{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:8px}.wn input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;width:16em}
.sh-err,.sh-wait{padding:24px;text-align:center;color:var(--sub)}.sh-err{color:var(--bad)}
.sh-grid{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--card)}
.sh-grid th{background:#1e40af;color:#fff;font-weight:600;padding:3px;border:1px solid #1e3a8a}.sh-grid th.su{background:#be123c}.sh-grid th.sa{background:#1d4ed8}
.sh-grid td{border:1px solid #6b7bbf;vertical-align:top;padding:2px 3px;min-height:120px}
.sh-grid td.empty{background:#f1f5f9}
.dnum{text-align:center;font-weight:700;font-size:13px}.day.su .dnum{color:#be123c}.day.sa .dnum{color:#1d4ed8}.dnote{color:#dc2626;font-size:11px;margin-left:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:1px}
.slot{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:1px 3px;background:transparent;font-size:12px;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot i{font-style:normal;font-weight:700;margin-right:2px}.slot.e i{color:var(--early)}.slot.l i{color:var(--late)}.slot small{font-size:10px;color:var(--sub)}
.slot:hover{background:#eef2ff}.slot.hole{background:var(--hole);outline:1px dashed var(--holeb);color:#92400e;font-weight:700}.slot.bad{background:#ffe4e6;outline:1px solid var(--bad)}.slot.rule{background:#ffedd5;outline:1px dashed #c2410c}.slot.turn{background:#ede9fe;outline:1px dashed #6d28d9}
.line{font-size:11.5px;margin-top:2px;line-height:1.35}.line .dk{border:0;padding:0;background:none;text-align:left;font-size:11.5px;width:100%}
.line.off .w{color:#ea580c}.line.wish{color:#9a3412}.woff{color:var(--bad);font-weight:700}
td.wishmode{cursor:pointer}td.wishmode:hover{background:#fff7ed}
.sh-h2{font-size:15px;margin:16px 0 6px}.sh-h2 small{font-size:12px;font-weight:normal;color:var(--sub);margin-left:8px}
.sh-base{border-collapse:collapse;background:var(--card);width:100%;table-layout:fixed}.sh-base th,.sh-base td{border:1px solid #c7cdd9;padding:2px 4px;text-align:center}

.sh-base tr.top>*{border-top:2px solid #6b7bbf}.sh-base td.na{background:#f1f5f9}.sh-base td button{border:0;background:none;padding:2px;width:100%;font-weight:700}.sh-base tr.off td{color:#ea580c;font-size:12px}.sh-base td button:hover{background:#eef2ff}

.sh-pat th,.sh-pat td{border:1px solid #6b7bbf;padding:3px 6px;text-align:center}.sh-pat thead th{background:#e0e7ff}
.sh-pat td button{border:0;background:none;padding:0 4px;min-width:3em}.sh-pat .p-off{color:#ea580c;font-weight:700}.sh-pat td.sum{text-align:left;font-size:12px}
.sh-holes{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.sh-holes h2{font-size:15px;margin:0 0 6px}.sh-holes textarea{width:100%;font:13px/1.6 inherit;font-family:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}
.conf{color:var(--bad);margin:4px 0 8px;padding-left:18px}.chk{display:block;margin:6px 0}.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.pk{background:#fff;border-radius:12px;padding:14px;width:min(420px,100%);max-height:90vh;overflow:auto}.pk.wide{width:min(640px,100%)}.pk h3{margin:0 0 8px;font-size:16px}.pk h4{margin:12px 0 4px;font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opt{text-align:left;display:flex;flex-direction:column;gap:2px}.opt.on{border-color:#13795b;background:#ecfdf5;font-weight:700}.opt em{font-style:normal;font-size:11px;color:var(--sub)}
label.opt{flex-direction:row;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px}
.tm{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:12px;color:var(--sub)}.tm input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.need{border-collapse:collapse}.need th,.need td{padding:2px 4px;text-align:center}.mrow{display:flex;gap:6px;margin-bottom:4px}.mrow input{flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.sh-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18201d;color:#fff;padding:10px 16px;border-radius:8px;z-index:60}
[hidden]{display:none!important}
@media (max-width:760px){.sh{padding:6px 4px 60px}.sh-grid{font-size:11px}.slot{font-size:10.5px}.line{font-size:10px}.sh-grid th{font-size:11px}}
@media print{@page{size:A4 landscape;margin:8mm}.sh-h2,.sh-base{display:none}body{background:#fff}.sh-tools,.sh-wishbar,.sh-holes,.st,.sh-cal,.sh-month button,.sh-tabs,#sghChip,.sgh-chip{display:none!important}.sh-bar{background:#fff;color:#000;border:1px solid #000}.slot.hole{outline:0;background:none}.sh{padding:0}}

.conf.rulex{color:#c2410c}.rrow{flex-wrap:wrap;gap:4px;align-items:center}.rrow select{padding:4px}
.conf.turnx{color:#6d28d9}

/* 希望のボタン（2026-11-07） */
.wpen{display:flex;flex-wrap:wrap;gap:6px}.wpen button{padding:6px 10px;border:1px solid #fdba74;border-radius:999px;background:#fff;font-size:13px;cursor:pointer}.wpen button[aria-pressed="true"]{background:#ea580c;border-color:#ea580c;color:#fff;font-weight:700}.wtime{display:inline-flex;gap:4px;align-items:center}.wtime input{padding:4px 6px;border:1px solid var(--line);border-radius:6px}

.st.bad{white-space:normal;word-break:break-all;max-width:100%;display:inline-block;border:1px solid var(--bad);font-weight:700}
</style>

"/* シフト表（マンション職員の早番・遅番・日勤）の画面。?page=shift\n   写真の紙のシフト表と同じ形：月のマス目に 早①②③・遅①②③・日勤・休み、下に職員ごとの曜日のパターンと今月の希望。\n   組む人（「職員ID」G列・管理者）は枠を入れる・基本パターンで下書き・空きを見てLINE文を作る・設定。表の職員は自分の希望だけ。\n   変更はすぐ端末に残し（sh:pend:…）、サーバーではロックの中で3者マージして保存（ほかの人の変更を消さない） */\n(function () {\n  \"use strict\";\n  const H = window.SGHost, X = window.SGShift;\n  const $ = (id) => document.getElementById(id);\n  const esc = (s) => String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g, (c) => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" })[c]);\n  const clone = (x) => JSON.parse(JSON.stringify(x == null ? null : x));\n  const pad = (n) => String(n).padStart(2, \"0\");\n  const today = new Date(), thisYm = /^\\d{4}-\\d{2}-\\d{2}$/.test(window.__SG_DATE || \"\") ? window.__SG_DATE.slice(0, 7) : `${today.getFullYear()}-${pad(today.getMonth() + 1)}`;   // ?d= があればその月\n  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };\n  const S = { group: store.get(\"sh:group\") === \"f\" ? \"f\" : \"m\", ym: thisYm, loaded: false, err: \"\", canEdit: false, member: false,\n    cfg: null, cfgBase: null, month: null, monthBase: null, mode: \"shift\", wishWho: \"\", withNames: true, saving: 0, failed: \"\", pick: null, settings: null, showLine: false };\n  const me = () => H.me || {};\n  const cfg = () => X.cfgOf(S.group, S.cfg);\n  const pendKey = (kind) => `sh:pend:${S.group}:${S.ym}:${kind}`;\n\n  /* ---------- 読み込み・保存 ---------- */\n  async function load(quiet) {\n    if (!quiet) { S.loaded = false; S.err = \"\"; render(); }\n    try {\n      const r = await H.call(\"shift.get\", { group: S.group, ym: S.ym });\n      S.canEdit = r.canEdit; S.member = r.member; S.myName = r.myName || me().name;\n      S.cfgBase = r.cfg.value; S.monthBase = r.month.value;\n      // まだ送れていない変更が端末に  // はじめての月など、カレンダーへの書き込みが残っていれば続けて頼む\n    } catch (e) { S.failed = ((e && e.message) || \"保存できませんでした\") + (e && e.code ? `［${e.code}］` : \"\"); setTimeout(() => save(kind), 15000); }\n    S.saving--; render();\n  }\n  // シフト表 → 職場カレンダー：残りを少しずつ書く（2026-11-07）。失敗しても次に保存したときにまた書く\n  let syncing = false;\n  async function calSync() {\n    if (syncing) return; syncing = true; S.calSyncing = true; render();\n    try { for (let i = 0; i \u003c 20; i++) { const r = await H.call(\"shift.syncCal\", { group: S.group, ym: S.ym }); if (!r || !(r.left > 0)) break; } } catch (e) {}\n    syncing = false; S.calSyncing = false; render();\n  }\n  const pendingCount = () => [\"cfg\", \"month\"].filter((k) => store.get(pendKey(k))).length;\n\n  /* ---------- 枠・希望の変更 ---------- */\n  const dayObj = (date) => { S.month = S.month || {}; S.month.days = S.month.days || {}; return (S.month.days[date] = Object.assign({ e: {}, l: {}, d: [] }, S.month.days[date] || {})); };\n  function setSlot(date, k, i, name, t) {\n    const d = dayObj(date); d[k] = Object.assign({}, d[k]);\n    if (name) d[k][i] = t ? { n: name, t } : { n: name }; else delete d[k][i];\n    changed(\"month\");\n  }\n  // 基本シフトを変える（設定に保存。曜日ごと）\n  function setBase(wd, fn) { const c = clone(cfg()); c.base = Object.assign({}, c.base); const b = Object.assign({ e: [], l: [], d: [] }, c.base[wd]); fn(b); c.base[wd] = b; S.cfg = c; changed(\"cfg\"); }\n  function setDayWorkers(date, names) { dayObj(date).d = names; changed(\"month\"); }\n  // 希望はボタンで選んでから日付を押す（2026-11-07 依頼者「休みや勤務をボタン式に。早番・遅番・マンション早のみなど＋その他で任意の時間」）。\n  // 同じ希望の日をもう一度押すと消える。「消す」を選んで押しても消える。その他は「9:00~15:00」のように時刻で持つ\n  const WISH_BTNS = [[\"休\", \"休み\"], [\"AM休\", \"AM休\"], [\"PM休\", \"PM休\"], [\"早\", \"早番\"], [\"遅\", \"遅番\"], [\"日\", \"日勤\"], [\"早ﾏﾝのみ\", \"早ﾏﾝｼｮﾝのみ\"], [\"遅ﾏﾝのみ\", \"遅ﾏﾝｼｮﾝのみ\"], [\"time\", \"その他(時刻)\"], [\"\", \"消す\"]];\n  S.pen = \"休\"; S.penFrom = \"\"; S.penTo = \"\";\n  const penValue = () => S.pen === \"time\" ? (S.penFrom && S.penTo ? `${S.penFrom.replace(/^0/, \"\")}~${S.penTo.replace(/^0/, \"\")}` : S.penFrom ? `${S.penFrom.replace(/^0/, \"\")}~` : \"\") : S.pen;\n  function cycleWish(date) {\n    const who = S.wishWho; if (!who) return;\n    const v = penValue(); if (S.pen === \"time\" && !v) { alert(\"その他は、上で時刻（何時から）を入れてから日付を押してください\"); return; }\n    S.month = S.month || {}; S.month.wish = Object.assign({}, S.month.wish); const w = Object.assign({}, S.month.wish[who]);\n    if (!v || w[date] === v) delete w[date]; else w[date] = v;\n    S.month.wish[who] = w; changed(\"month\");\n  }\n\n  /* ---------- 描く ---------- */\n  function render() {\n    const root = $(\"shRoot\"); if (!root) return;\n    const c = cfg();\n    const status = S.failed ? `\u003cspan class=\"st bad\" data-sh-failed title=\"${esc(S.failed)}\">未送信（自動で送り直します）：${esc(S.failed)}\u003c/span>` : S.saving || pendingCount() ? `\u003cspan class=\"st busy\">保存中…\u003c/span>` : S.loaded ? `\u003cspan class=\"st ok\">保存済み ✓${S.calSyncing ? \"（カレンダーに反映中…）\" : \"\"}\u003c/span>` : \"\";\n    const [y, m] = S.ym.split(\"-\").map(Number);\n    let html = `\u003cheader class=\"sh-bar\">\u003cdiv class=\"sh-title\">${esc(c.title)}\u003c/div>\n      \u003cnav class=\"sh-tabs\">${Object.entries(X.GROUPS).map(([k, n]) => `\u003cbutton data-group=\"${k}\" aria-pressed=\"${S.group === k}\">${n}\u003c/button>`).join(\"\")}\u003c/nav>\n      ${H.url(\"\") ? `\u003cbutton class=\"sh-cal\" data-act=\"calendar\" title=\"職場カレンダーに戻る\">📅 カレンダー\u003c/button>` : \"\"}\u003cdiv class=\"sh-month\">\u003cbutton data-mon=\"-1\" aria-label=\"前の月\">‹\u003c/button>\u003cb>${y}年${m}月\u003c/b>\u003cbutton data-mon=\"1\" aria-label=\"次の月\">›\u003c/button>\u003c/div>${status}\u003c/header>`;\n    if (S.err) { root.innerHTML = html + `\u003cp class=\"sh-err\">${esc(S.err)}\u003c/p>`; return; }\n    if (!S.loaded) { root.innerHTML = html + `\u003cp class=\"sh-wait\">読み込んでいます…\u003c/p>`; return; }\n    html += `\u003cdiv class=\"sh-tools\">` + (S.canEdit ? `\u003cspan class=\"seg\">\u003cbutton data-mode=\"shift\" aria-pressed=\"${S.mode === \"shift\"}\">シフトを組む\u003c/button>\u003cbutton data-mode=\"wish\" aria-pressed=\"${S.mode === \"wish\"}\">希望を入れる\u003c/button>\u003c/span>\n      \u003cbutton data-act=\"draft\" title=\"職員ごとの曜日のパターン（下の表）と希望から、空いている枠だけを埋めます\">基本パターンで下書き\u003c/button>\n      \u003cbutton data-act=\"line\" class=\"primary\">空きを見てLINE文を作る\u003c/button>\u003cbutton data-act=\"excel\" data-excel title=\"この月のシフト表を、紙と同じカレンダーの形でExcelに出します（A4横）\">Excelで出力\u003c/button>\u003cbutton data-act=\"settings\">設定（職員・枠の数）\u003c/button>` : `\u003cspan class=\"note\">あなたの希望を入れられます（日付を押すたびに 休→PM休→AM休→早→遅→日→なし）\u003c/span>`) + `\u003c/div>`;\n    if (S.mode === \"wish\") html += `\u003cdiv class=\"sh-wishbar\">希望を入れる人：${S.canEdit ? `\u003cselect id=\"shWho\">${c.members.map((x) => `\u003coption ${x.name === S.wishWho ? \"selected\" : \"\"}>${esc(x.name)}\u003c/option>`).join(\"\")}\u003c/select>` : `\u003cb>${esc(S.wishWho)}\u003c/b>`}\n      \u003cspan class=\"wpen\" data-wpen-bar>${WISH_BTNS.map(([k, n]) => `\u003cbutton type=\"button\" data-wpen=\"${esc(k)}\" aria-pressed=\"${S.pen === k}\">${esc(n)}\u003c/button>`).join(\"\")}\u003c/span>\n      ${S.pen === \"time\" ? `\u003cspan class=\"wtime\">\u003cinput type=\"time\" id=\"shPenFrom\" step=\"300\" value=\"${esc(S.penFrom)}\" aria-label=\"何時から\">〜\u003cinput type=\"time\" id=\"shPenTo\" step=\"300\" value=\"${esc(S.penTo)}\" aria-label=\"何時まで\">\u003c/span>` : \"\"}\n      \u003cspan class=\"note\">ボタンを選んでから日付のマスを押してください（同じ希望の日をもう一度押すと消えます）\u003c/span>\n      \u003clabel class=\"wn\">ひとこと：\u003cinput id=\"shWishNote\" maxlength=\"80\" value=\"${esc(((S.month && S.month.wishNote) || {})[S.wishWho] || \"\")}\" placeholder=\"例：13〜17日 旅行\">\u003c/label>\u003c/div>`;\n    const hs = X.holes(S.month, c, S.ym), holeSet = new Set(hs.map((h) => `${h.date}|${h.kind}|${h.idx}`));\n    const conf = X.conflicts(S.month, c, S.ym), confSet = new Set(conf.map((x) => `${x.date}|${x.name}`));\n    const le = X.lateEarly(S.month, c, S.ym), leSet = new Set(le.map((x) => `${x.date}|e|${x.slot}`)), leFix = le.length ? X.fixLateEarly(S.month, c, S.ym) : { fixed: [], left: [] };\n    const ri = X.ruleIssues(S.month, c, S.ym), riSet = new Set(ri.map((x) => `${x.date}|${x.kind}|${x.now}`));\n    const days = X.daysOfMonth(S.ym), lead = X.wdOf(days[0]);\n    html += `\u003ctable class=\"sh-grid\">\u003cthead>\u003ctr>${X.WD.map((w, i) => `\u003cth class=\"${i === 0 ? \"su\" : i === 6 ? \"sa\" : \"\"}\">${w}曜日\u003c/th>`).join(\"\")}\u003c/tr>\u003c/thead>\u003ctbody>`;\n    const cells = Array(lead).fill(null).concat(days);\n    while (cells.length % 7) cells.push(null);\n    for (let r = 0; r \u003c cells.length; r += 7) {\n      html += \"\u003ctr>\" + cells.slice(r, r + 7).map((date) => {\n        if (!date) return `\u003ctd class=\"empty\">\u003c/td>`;\n        const d = X.daysOfMonth ? (S.month && S.month.days || {})[date] || {} : {}, need = X.needOf(c, date);\n        const slot = (k, i) => { const s = (d[k] || {})[i], n = X.slotName(s), hole = holeSet.has(`${date}|${k}|${i}`), bad = n && confSet.has(`${date}|${n}`);\n          return `\u003cbutton class=\"slot ${k}${hole ? \" hole\" : \"\"}${bad ? \" bad\" : \"\"}${riSet.has(`${date}|${k}|${i}`) ? \" rule\" : \"\"}${leSet.has(`${date}|${k}|${i}`) ? \" turn\" : \"\"}\" data-slot=\"${date}|${k}|${i}\" ${S.mode === \"wish\" ? \"tabindex=-1\" : \"\"}>\u003ci>${X.KIND[k]}${X.MARK[i] || i}\u003c/i>${n ? esc(n) + (s && s.t ? `\u003csmall>(${esc(s.t)})\u003c/small>` : \"\") : hole ? \"空き\" : \"\"}\u003c/button>`; };\n        const maxE = Math.max(need.e, ...Object.keys(d.e || {}).map(Number), 0), maxL = Math.max(need.l, ...Object.keys(d.l || {}).map(Number), 0);\n        const rows = Math.max(maxE, maxL);\n        let grid = \"\";\n        for (let i = 1; i \u003c= rows; i++) grid += `\u003cdiv class=\"pair\">${i \u003c= maxE ? slot(\"e\", i) : `\u003cspan>\u003c/span>`}${i \u003c= maxL ? slot(\"l\", i) : `\u003cspan>\u003c
